<!doctype html>
<html lang="{{ locale }}" dir="{{ dir }}">
  <body style="margin:0; padding:0; background-color:#f4f5f2; font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f5f2; padding:32px 0;">
      <tr>
        <td align="center">
          <table role="presentation" width="480" cellpadding="0" cellspacing="0" dir="{{ dir }}" style="background-color:#ffffff; border-radius:8px; overflow:hidden; border:1px solid #e2e5e0;">
            <tr>
              <td style="padding:32px 32px 8px; font-size:20px; font-weight:700; color:#14181a;">
                {{ mail_from_name }}
              </td>
            </tr>
            <tr>
              <td style="padding:8px 32px 0; font-size:15px; line-height:1.6; color:#14181a;">
                <p style="margin:0 0 12px;">{{ greeting }}</p>
                <p style="margin:0;">{{ intro }}</p>
              </td>
            </tr>
            <tr>
              <td style="padding:24px 32px;">
                <a href="{{ reset_link }}" style="display:inline-block; background-color:#0b7a5c; color:#ffffff; text-decoration:none; font-weight:600; font-size:15px; padding:12px 24px; border-radius:6px;">
                  {{ button_label }}
                </a>
              </td>
            </tr>
            <tr>
              <td style="padding:0 32px 32px; font-size:13px; line-height:1.6; color:#5b655e;">
                <p style="margin:0 0 8px;">{{ fallback_intro }}</p>
                <p style="margin:0 0 16px; word-break:break-all;"><a href="{{ reset_link }}" style="color:#0b7a5c;">{{ reset_link }}</a></p>
                <p style="margin:0;">{{ ignore_text }}</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
