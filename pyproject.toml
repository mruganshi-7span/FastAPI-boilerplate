[project]
name = "fasticket-fastapi"
version = "0.1.0"
description = "FasTicket FastAPI backend (Auth + Users)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.3",
    "psycopg[binary]>=3.2.3",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    "email-validator>=2.2.0",
    "bcrypt>=4.1.2",
    "python-jose[cryptography]>=3.3.0",
    "arq>=0.26.1",
    "aiosmtplib>=3.0.2",
    "jinja2>=3.1.4",
    "boto3>=1.35.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
