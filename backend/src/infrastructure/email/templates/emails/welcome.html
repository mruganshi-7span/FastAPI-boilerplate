<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Welcome to {{ app_name }}</title>
  </head>
  <body style="margin:0; padding:0; background-color:#f4f5f2; font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f5f2; padding:32px 0;">
      <tr>
        <td align="center">
          <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color:#ffffff; border-radius:8px; overflow:hidden; border:1px solid #e2e5e0;">
            <tr>
              <td style="padding:32px 32px 8px; font-size:20px; font-weight:700; color:#14181a;">
                {{ app_name }}
              </td>
            </tr>
            <tr>
              <td style="padding:8px 32px 0; font-size:15px; line-height:1.6; color:#14181a;">
                <p style="margin:0 0 12px;">Hi {{ name }},</p>
                <p style="margin:0 0 12px;">Welcome to {{ app_name }}! Your account has been created and you're all set to get started.</p>
                <p style="margin:0;">If you have any questions, just reply to this email and we'll be happy to help.</p>
              </td>
            </tr>
            <tr>
              <td style="padding:24px 32px 32px; font-size:15px; line-height:1.6; color:#14181a;">
                <p style="margin:0;">Thanks,<br>The {{ app_name }} team</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
